header small{color:#fff;opacity:1;font-weight:800;letter-spacing:.08em;text-shadow:0 2px 5px rgba(0,0,0,.8)}header h1{margin:5px 0;font-size:23px;color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.85)}header p{margin:0;color:#fff;opacity:1;font-size:13px;text-shadow:0 1px 6px rgba(0,0,0,.9)}header #syncStatus{display:inline-block;padding:4px 9px;border-radius:20px;background:rgba(0,0,0,.38);color:#fff!important;font-weight:650} header #userBar{color:#fff;text-shadow:0 1px 5px rgba(0,0,0,.9)}
main{padding:15px;max-width:760px;margin:auto}
.tabs{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom));max-width:736px;margin:0 auto;background:rgba(255,255,255,.55);-webkit-backdrop-filter:blur(22px) saturate(180%);backdrop-filter:blur(22px) saturate(180%);border:1px solid rgba(255,255,255,.8);border-radius:24px;box-shadow:0 10px 30px rgba(20,83,45,.2),inset 0 1px 0 rgba(255,255,255,.9);display:flex;overflow:auto;z-index:5;padding:6px;gap:2px}
.tabs button{flex:1;min-width:58px;border:0;background:none;border-radius:18px;color:#4d6054;font-size:10px;padding:7px 2px;transition:background .2s,color .2s}.tabs button span{display:block;font-size:19px;margin-bottom:2px}.tabs button.active{color:var(--green);font-weight:800;background:rgba(20,83,45,.14);box-shadow:inset 0 1px 0 rgba(255,255,255,.8),0 2px 8px rgba(20,83,45,.12)}
.card{background:var(--glass);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--glass-brd);border-radius:20px;padding:16px;margin:0 0 14px;box-shadow:0 8px 28px rgba(20,83,45,.12),inset 0 1px 0 rgba(255,255,255,.85)}
h2{font-size:18px;margin:4px 0 14px}h3{font-size:15px;margin:0 0 9px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.metric{background:var(--glass2);border:1px solid rgba(255,255,255,.65);border-radius:14px;padding:12px;box-shadow:inset 0 1px 0 rgba(255,255,255,.75)}.metric small{display:block;color:var(--muted);font-size:11px}.metric strong{display:block;font-size:17px;margin-top:4px;overflow-wrap:anywhere}
.metric.income{background:rgba(220,252,231,.72);border-color:rgba(74,222,128,.5);border-left:5px solid #16a34a}
.metric.expense{background:rgba(254,226,226,.82);border-color:rgba(248,113,113,.5);border-left:5px solid var(--red);box-shadow:0 2px 10px rgba(180,35,24,.12),inset 0 1px 0 rgba(255,255,255,.8)}
.metric.expense small{color:var(--red);font-weight:700}
.item.expense{background:rgba(254,226,226,.6);border-color:rgba(248,113,113,.4);border-left:5px solid var(--red)}
.item.income{background:rgba(220,252,231,.58);border-color:rgba(74,222,128,.45);border-left:5px solid #16a34a}
label{display:block;font-size:12px;color:#44574a;margin:10px 0 5px}
input,select,textarea{width:100%;border:1px solid rgba(255,255,255,.85);border-radius:12px;padding:11px;background:rgba(255,255,255,.6);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);box-shadow:inset 0 1px 3px rgba(20,83,45,.1);font:inherit;color:var(--ink);min-height:43px}textarea{min-height:70px}
input:focus,select:focus,textarea:focus{outline:2px solid rgba(22,101,52,.45);outline-offset:1px;background:rgba(255,255,255,.8)}
input::placeholder{color:#7b8c81}
.row{display:flex;gap:8px}.row>*{flex:1;min-width:0}
.btn{border:0;border-radius:12px;padding:11px 14px;background:linear-gradient(135deg,#1f8a4c,#14532d);color:#fff;font:inherit;font-weight:700;box-shadow:0 4px 14px rgba(20,83,45,.3),inset 0 1px 0 rgba(255,255,255,.35)}
.btn.secondary{background:rgba(255,255,255,.55);color:var(--green);border:1px solid rgba(255,255,255,.85);box-shadow:0 2px 8px rgba(20,83,45,.1),inset 0 1px 0 rgba(255,255,255,.9);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.btn.danger{background:rgba(254,226,226,.6);color:var(--red);border:1px solid rgba(255,255,255,.8);box-shadow:0 2px 8px rgba(180,35,24,.1),inset 0 1px 0 rgba(255,255,255,.8)}
.btn.small{padding:7px 10px;font-size:12px}.btn:active{transform:scale(.97)}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.item{background:var(--glass2);border:1px solid rgba(255,255,255,.7);border-radius:14px;padding:12px;margin-top:9px;box-shadow:inset 0 1px 0 rgba(255,255,255,.7)}
.itemtop{display:flex;justify-content:space-between;gap:8px}.muted{color:var(--muted);font-size:12px}.amount{font-weight:800}.positive{color:#16803d}.negative{color:#b42318}
.pill{font-size:11px;padding:4px 9px;border-radius:20px;background:rgba(255,255,255,.65);border:1px solid rgba(255,255,255,.85);color:#27633a;white-space:nowrap;align-self:flex-start}
.empty{text-align:center;color:var(--muted);padding:22px 8px}
.search{margin-bottom:8px}.hide{display:none!important}.note{font-size:12px;color:var(--muted);line-height:1.5}.receipt{border:1px dashed #9aa79e;padding:18px;border-radius:10px}
.item.unpaid{background:rgba(254,226,226,.55);border-color:rgba(248,113,113,.4);border-left:5px solid var(--red)}
.item.partial{background:rgba(254,243,199,.6);border-color:rgba(251,191,36,.45);border-left:5px solid #d97706}
.item.paid{background:rgba(220,252,231,.58);border-color:rgba(74,222,128,.45);border-left:5px solid #16a34a}
.pill.red{background:var(--red);border-color:transparent;color:#fff;font-weight:700}.pill.amber{background:rgba(254,243,199,.9);color:#92400e}.pill.green{background:rgba(22,163,74,.18);border-color:rgba(22,163,74,.3);color:#14532d;font-weight:700}
.paidline{margin-top:6px;display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:20px;background:rgba(255,255,255,.6);border:1px solid rgba(74,222,128,.5);color:#14532d;font-size:12px}
.chip{display:inline-block;margin:3px 4px 0 0;padding:4px 10px;border-radius:20px;background:rgba(254,226,226,.7);border:1px solid rgba(255,255,255,.8);color:var(--red);font-size:12px;font-weight:700}

/* ===== KONEKSI SUPABASE — isi dua nilai ini (Project Settings > API) ===== */
const SUPABASE_URL = 'https://ufjhkscgbrmhuuoctkgr.supabase.co';
const SUPABASE_KEY = 'sb_publishable_D5ln2629-5sxQUzek6-feg_ArmyMz1M';
/* Kunci anon/publishable memang boleh publik; data dilindungi fungsi login di database. JANGAN pakai service_role. */
(function(){
  const RPC={
    login:['krt_login',['p_username','p_password']],
    logout:['krt_logout',['p_token']],
    getDatabase:['krt_get_database',['p_token']],
    saveDatabase:['krt_save_database',['p_payload']],
    daftarAkun:['krt_daftar_akun',['p_token']],
    buatAkun:['krt_buat_akun',['p_token','p_data']],
    ubahStatusAkun:['krt_ubah_status_akun',['p_token','p_username','p_aktif']],
    resetPasswordAkun:['krt_reset_password_akun',['p_token','p_username']],
    buatAkunWarga:['krt_buat_akun_warga',['p_token']],
    daftarToken:['krt_daftar_token',['p_token','p_fcm']],
    hapusToken:['krt_hapus_token',['p_token','p_fcm']],
    gantiPassword:['krt_ganti_password',['p_token','p_lama','p_baru']],
    gantiUsername:['krt_ganti_username',['p_token','p_password','p_baru']],
    hapusAkun:['krt_hapus_akun',['p_token','p_username','p_alasan']],
    bacaAudit:['krt_baca_audit',['p_token','p_batas','p_sebelum']],
    verifikasiAudit:['krt_verifikasi_audit',['p_token']]
  };
  function call(def,args){
    const body={};def[1].forEach((k,i)=>body[k]=args[i]===undefined?null:args[i]);
    const headers={'Content-Type':'application/json',apikey:SUPABASE_KEY};
    if(SUPABASE_KEY.startsWith('eyJ'))headers.Authorization='Bearer '+SUPABASE_KEY;
    const ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),window.KRT_TIMEOUT||25000);
    return fetch(SUPABASE_URL+'/rest/v1/rpc/'+def[0],{method:'POST',headers,body:JSON.stringify(body),signal:ctl.signal}).then(async r=>{
      const t=await r.text();let j=null;try{j=JSON.parse(t)}catch(e){}
      if(!r.ok)throw new Error((j&&j.message)||'Gagal terhubung ke server.');
      return j;
    }).finally(()=>clearTimeout(to));
  }
  function builder(ok,fail){
    return new Proxy({},{get(_,name){
      if(name==='withSuccessHandler')return f=>builder(f,fail);
      if(name==='withFailureHandler')return f=>builder(ok,f);
      const def=RPC[name];if(!def)return undefined;
      return (...args)=>{call(def,args).then(v=>{if(ok)ok(v)},e=>{if(fail)fail(e)})};
    }});
  }
  window.google={script:{get run(){return builder(null,null)}}};
})();

<script>
let pushDaftar=false;
const IDENTITAS={rt:'RT 003',rw:'RW 001',desa:'JATIREJO',kecamatan:'GUNUNGPATI',kota:'KOTA SEMARANG'}; // dikunci, tidak bisa diubah dari aplikasi
function kunciIdentitas(){if(!db.settings||typeof db.settings!=='object')db.settings={};for(const k of Object.keys(IDENTITAS)){db.settings[k]=IDENTITAS[k]}}
const defaults={settings:{rt:'RT 001',rw:'RW 001',desa:'Isi nama desa/kelurahan',kecamatan:'Isi nama kecamatan',kota:'Isi nama kabupaten/kota',tahun:2026,saldo:0,bendahara:''},warga:[],transaksi:[]};
let db=structuredClone(defaults),tab='home',editId=null;
let auth={token:'',user:'',role:'',temp:false},accounts=[],loginMsg='',loginShown=false,setupDone=true;
try{auth.token=sessionStorage.getItem('krt_token')||''}catch(e){}
const ROLE_LABEL={admin:'Admin',operator:'Operator',viewer:'Viewer',warga:'Warga'};
function canEdit(){return auth.role==='admin'||auth.role==='operator'}
function isAdmin(){return auth.role==='admin'}
function isWarga(){return auth.role==='warga'}
function need(){if(canEdit())return true;alert(auth.role==='warga'?'Akun warga hanya dapat melihat data.':'Akun Viewer hanya dapat melihat data.');return false}
function setAuth(t,u,r,temp){auth={token:t||'',user:u||'',role:r||'',temp:!!temp};try{t?sessionStorage.setItem('krt_token',t):sessionStorage.removeItem('krt_token')}catch(e){}renderHeaderUser();document.querySelector('.tabs').classList.toggle('hide',!t);let wt=document.querySelector('.tabs button[data-tab="warga"]');if(wt)wt.classList.toggle('hide',r==='warga')}
function renderHeaderUser(){let el=document.getElementById('userBar');if(!el)return;el.innerHTML=auth.role?`Masuk: <b>${esc(auth.user)}</b> (${ROLE_LABEL[auth.role]||auth.role}) <button class="btn small" style="background:#ffffff33;margin-left:6px" onclick="doLogout()">Keluar</button>`:'Belum masuk'}
function showModal(h){document.getElementById('sheet').innerHTML=h;document.getElementById('modal').classList.remove('hide')}
function closeModal(){document.getElementById('modal').classList.add('hide')}
function srv(fn,args,ok){google.script.run.withSuccessHandler(ok).withFailureHandler(err=>{let m=(err&&err.message)||'Gagal terhubung ke server.';if(m.includes('Sesi login')){setAuth();loginMsg='Sesi login berakhir. Silakan masuk lagi.';loginShown=false;render()}alert(m)})[fn](...args)}
let cloudReady=false,cloudSaving=false,cloudPending=false,cloudRevision=0,cloudRefreshing=false;
/* ===== Antrean offline: perubahan yang gagal terkirim disimpan di HP lalu dikirim otomatis ===== */
let baseDb=null,offlineDirty=false,mergeTries=0,pendingAlerted=false,pendingTimer=null,konflikInfo=0;
const PENDING_KEY='krt_pending_v1';
function cloneDb(x){return JSON.parse(JSON.stringify(x))}
function canon(x){if(Array.isArray(x))return '['+x.map(canon).join(',')+']';if(x&&typeof x==='object')return '{'+Object.keys(x).sort().map(k=>JSON.stringify(k)+':'+canon(x[k])).join(',')+'}';return JSON.stringify(x)}
function isNetErr(e){return !!e&&(e.name==='TypeError'||e.name==='AbortError')}
function diffCount(base,local){
  let n=0;
  for(const key of ['warga','transaksi']){
    const B=new Map(((base&&base[key])||[]).map(x=>[x.id,canon(x)])),L=new Map(((local&&local[key])||[]).map(x=>[x.id,canon(x)]));
    for(const [id,c] of L){if(!B.has(id)||B.get(id)!==c)n++}
    for(const id of B.keys())if(!L.has(id))n++;
  }
  const bs=(base&&base.settings)||{},ls=(local&&local.settings)||{};
  for(const k of new Set([...Object.keys(bs),...Object.keys(ls)]))if(canon(bs[k])!==canon(ls[k]))n++;
  return n;
}
function mergeById(base,local,server){
  const B=new Map((base||[]).map(x=>[x.id,x])),L=new Map((local||[]).map(x=>[x.id,x])),S=new Map((server||[]).map(x=>[x.id,x]));
  const out=(server||[]).slice(),pos=new Map(out.map((x,i)=>[x.id,i]));let konflik=0;
  for(const [id,l] of L){
    const b=B.get(id);
    if(!b){if(!S.has(id))out.push(l);continue}
    if(canon(b)!==canon(l)){
      const sv=S.get(id);
      if(!sv){konflik++;continue}
      if(canon(sv)===canon(b))out[pos.get(id)]=l;else konflik++;
    }
  }
  const del=new Set();for(const id of B.keys())if(!L.has(id))del.add(id);
  return {arr:out.filter(x=>!del.has(x.id)),konflik};
}
function mergeSettings(b,l,sv){
  const out=cloneDb(sv);let konflik=0;
  for(const k of new Set([...Object.keys(b),...Object.keys(l)])){
    if(canon(b[k])===canon(l[k]))continue;
    if(canon(sv[k])===canon(b[k])){if(k in l)out[k]=l[k];else delete out[k]}
    else konflik++;
  }
  return {obj:out,konflik};
}
function mergeDb(base,local,server){
  const out=cloneDb(server);let konflik=0;
  for(const key of ['warga','transaksi']){const r=mergeById(base[key],local[key],server[key]);out[key]=r.arr;konflik+=r.konflik}
  const r=mergeSettings(base.settings||{},local.settings||{},server.settings||{});out.settings=r.obj;konflik+=r.konflik;
  if(local&&local._alasan&&typeof local._alasan==='object') out._alasan=Object.assign({},local._alasan);
  return {db:out,konflik};
}
function persistPending(){try{localStorage.setItem(PENDING_KEY,JSON.stringify({user:auth.user,savedAt:Date.now(),base:baseDb,local:db}))}catch(e){}}
function clearPending(){try{localStorage.removeItem(PENDING_KEY)}catch(e){}}
function updateOfflineBar(){
  const el=document.getElementById('offlineBar');if(!el)return;
  if(!offlineDirty){el.classList.add('hide');return}
  const n=Math.max(1,diffCount(baseDb,db));
  el.textContent='⚠ Belum tersimpan · '+n+' perubahan menunggu internet · ketuk untuk kirim';
  el.classList.remove('hide');
}
function queueOffline(){
  cloudPending=true;offlineDirty=true;persistPending();
  setSyncStatus('Belum tersimpan · menunggu internet',false);updateOfflineBar();
  if(!pendingAlerted){pendingAlerted=true;alert('Tidak ada koneksi internet. Perubahan disimpan sementara di HP dan akan dikirim otomatis saat internet kembali.\n\nJangan keluar dari aplikasi sebelum status berubah menjadi "Tersinkron".')}
  if(!pendingTimer)pendingTimer=setInterval(()=>retryPending(false),15000);
}
function retryPending(manual){
  if(!offlineDirty||cloudSaving)return;
  cloudPending=true;if(manual)setSyncStatus('Mengirim perubahan…');
  syncSave();
}
function selesaiAntrean(){
  offlineDirty=false;pendingAlerted=false;clearPending();
  if(pendingTimer){clearInterval(pendingTimer);pendingTimer=null}
  updateOfflineBar();
}
function mergeAndRetry(){
  if(mergeTries>=3){mergeTries=0;syncFail('Perubahan Anda belum tersimpan karena data terus berubah dari perangkat lain. Data terbaru akan dimuat, lalu ulangi input Anda.');return}
  mergeTries++;
  google.script.run
    .withSuccessHandler(r=>{
      if(!(r&&r.ok&&r.db)){syncFail('Gagal memuat data terbaru dari server. Data akan dimuat ulang, lalu ulangi input Anda.');return}
      const m=mergeDb(baseDb||r.db,db,r.db);
      db=m.db;kunciIdentitas();baseDb=cloneDb(r.db);cloudRevision=r.revision||0;konflikInfo+=m.konflik;
      cloudPending=true;syncSave();
      const a=document.activeElement;if(!(a&&['INPUT','SELECT','TEXTAREA'].includes(a.tagName)))render();
    })
    .withFailureHandler(e=>{if(isNetErr(e))queueOffline();else syncFail('Gagal memuat data terbaru dari server. Data akan dimuat ulang, lalu ulangi input Anda.')})
    .getDatabase(auth.token);
}
function tryRestorePending(){
  let raw=null;try{raw=localStorage.getItem(PENDING_KEY)}catch(e){}
  if(!raw||!canEdit())return;
  let p;try{p=JSON.parse(raw)}catch(e){clearPending();return}
  if(!p||!p.local||!p.base||Date.now()-(p.savedAt||0)>7*864e5){clearPending();return}
  if(p.user!==auth.user)return;
  if(diffCount(p.base,p.local)===0){clearPending();return}
  const m=mergeDb(p.base,p.local,db);
  db=m.db;kunciIdentitas();offlineDirty=true;cloudPending=true;persistPending();updateOfflineBar();
  const n=diffCount(baseDb,db);
  setTimeout(()=>alert('Perubahan yang belum terkirim dari sebelumnya ('+n+' perubahan) dipulihkan dan sedang dikirim ke server.'+(m.konflik?'\n'+m.konflik+' perubahan bentrok dengan data terbaru sehingga tidak dipakai.':'')),300);
  syncSave();
}
window.addEventListener('online',()=>retryPending(false));
document.addEventListener('visibilitychange',()=>{if(!document.hidden)retryPending(false)});
function setSyncStatus(message,good=true){
  const el=document.getElementById('syncStatus');
  if(el){el.textContent=message;el.style.color=good?'#dcfce7':'#ffe0a6';}
}
function save(){
  kunciIdentitas();
  if(!canEdit()){alert(auth.role==='warga'?'Akun warga hanya dapat melihat data.':'Akun Viewer hanya dapat melihat data.');return;}
  if(!cloudReady){
    offlineDirty=true;persistPending();
    setSyncStatus('Belum terhubung · perubahan ditampung di HP',false);updateOfflineBar();
    if(!pendingAlerted){pendingAlerted=true;alert('Belum terhubung ke server. Perubahan ditampung di HP dan akan dikirim setelah koneksi pulih.')}
    return;
  }
  if(offlineDirty)persistPending();
  cloudPending=true;syncSave();
}
function syncFail(msg){
  cloudPending=false;cloudReady=false;setSyncStatus('Memuat ulang data…',false);
  alert(msg);refreshCloud(false);
}
function syncSave(){
  if(cloudSaving||!cloudPending||!cloudReady)return;
  cloudSaving=true;cloudPending=false;setSyncStatus('Menyimpan ke Supabase…');
  const snapshot=JSON.parse(JSON.stringify(db));
  google.script.run
    .withSuccessHandler(result=>{
      cloudSaving=false;
      if(result&&result.ok){cloudRevision=result.revision;baseDb=snapshot;mergeTries=0;if(db&&db._alasan)delete db._alasan;if(typeof auditCache!=='undefined'){auditCache.loaded=false;auditCache.items=[];}if(offlineDirty&&!cloudPending)selesaiAntrean();setSyncStatus('Tersinkron ke Supabase');if(cloudPending)syncSave();else if(konflikInfo>0){let k=konflikInfo;konflikInfo=0;alert('Perubahan Anda sudah tersimpan. Catatan: '+k+' perubahan bentrok dengan perubahan dari perangkat lain, jadi data terbaru yang dipakai. Mohon periksa kembali.')}return;}
      if(result&&result.auth){persistPending();offlineDirty=false;updateOfflineBar();setAuth();loginMsg='Sesi login berakhir. Perubahan terakhir disimpan di HP dan akan dikirim setelah Anda masuk lagi.';loginShown=false;cloudPending=false;cloudReady=false;render();return;}
      if(result&&result.forbidden){syncFail(result.message||'Akun Anda tidak berhak mengubah data.');return;}
      mergeAndRetry();
    })
    .withFailureHandler(err=>{
      cloudSaving=false;
      queueOffline();
      if(!isNetErr(err)){
        setSyncStatus('Gagal menyimpan · akan dicoba lagi',false);
        alert('Gagal menyimpan ke server: '+(err&&err.message?err.message:'Kesalahan server')+'. Perubahan ditampung di HP dan akan dikirim ulang otomatis.');
      }
    })
    .saveDatabase({db:snapshot,revision:cloudRevision,token:auth.token});
}
function refreshCloud(silent=false){
  if(cloudRefreshing||cloudSaving||cloudPending)return;
  cloudRefreshing=true;
  google.script.run
    .withSuccessHandler(result=>{
      cloudRefreshing=false;
      if(result&&result.auth){
        setupDone=result.setupDone!==false;
        if(auth.role||auth.token){setAuth();loginMsg='Sesi login berakhir. Silakan masuk lagi.';loginShown=false}
        cloudReady=false;setSyncStatus('Silakan masuk',false);
        if(!loginShown)render();
        return;
      }
      if(result&&result.ok){
        let roleChanged=false;
        if(result.session&&(auth.role!==result.session.role||auth.user!==result.session.user||auth.temp!==!!result.session.temp)){setAuth(auth.token,result.session.user,result.session.role,result.session.temp);roleChanged=true}
        const incomingRevision=result.revision||0;
        const changed=!cloudReady||incomingRevision!==cloudRevision;
        if(changed){
          const active=document.activeElement;
          const editing=active&&(['INPUT','SELECT','TEXTAREA'].includes(active.tagName));
          if(editing&&cloudReady){
            setSyncStatus('Ada pembaruan dari HP lain · selesaikan isian lalu perbarui',false);
            return;
          }
          db=result.db||structuredClone(defaults);kunciIdentitas();cloudRevision=incomingRevision;cloudReady=true;baseDb=cloneDb(db);tryRestorePending();
          render();
        }else if(roleChanged)render();
        cloudReady=true;
        if(!pushDaftar){pushDaftar=true;daftarPush(0)}
        setSyncStatus('Terhubung · sinkron '+new Date().toLocaleTimeString('id-ID'));
      }else if(!silent){setSyncStatus('Gagal membaca database',false);alert('Tidak dapat membaca database.');}
    })
    .withFailureHandler(err=>{
      cloudRefreshing=false;setSyncStatus('Tidak terhubung ke server',false);
      if(!silent){
        let msg=(err&&err.message)?err.message:'Periksa koneksi internet.';

function formatAuditWaktu(w){

function auditIsiRingkas(e){
  if(e.objek==='Akun'&&e.aksi==='Hapus'){
    let b=e.sebelum||{};
    return `Akun dihapus: <b>${esc(b.username||e.ref_id||'-')}</b>${b.role?' · '+esc(ROLE_LABEL[b.role]||b.role):''}`;
  }
  if(e.objek==='Akun'){
    return `Nama pengguna: <b>${esc((e.sebelum&&e.sebelum.username)||'-')}</b> → <b>${esc((e.sesudah&&e.sesudah.username)||'-')}</b>`;
  }
  if(e.objek==='Warga'){
    let n=(e.sesudah&&e.sesudah.nama)||(e.sebelum&&e.sebelum.nama)||'-';
    let al=(e.sesudah&&e.sesudah.alamat)||(e.sebelum&&e.sebelum.alamat)||'';
    let hp=(e.sesudah&&e.sesudah.hp)||(e.sebelum&&e.sebelum.hp)||'';
    return `<b>${esc(n)}</b>${al?' · '+esc(al):''}${hp?' · '+esc(hp):''}`;
  }
  if(e.objek==='Transaksi'){
    let src=e.sesudah||e.sebelum||{};
    let ura=src.uraian||src.kategori||'Transaksi';
    let nom=src.nominal!=null?rup(src.nominal):'';
    let tgl=src.tanggal||'',jns=src.jenis||'',kat=src.kategori||'';
    let w=src.wargaId&&namaWarga(src.wargaId)?namaWarga(src.wargaId):'';
    let per=src.periode?periodOf(src):'';
    return `<b>${esc(ura)}</b> · ${esc(jns)} ${esc(kat)} · <b>${nom}</b> · ${esc(tgl)}${w?' · '+esc(w):''}${per?' · periode '+esc(per):''}`;
  }
  if(e.objek==='Pengaturan'){
    let keys=Array.isArray(e.perubahan)?e.perubahan:(e.perubahan?Object.keys(e.perubahan):[]);
    return 'Kolom: '+(keys.length?keys.map(k=>esc(k)).join(', '):'(pengaturan)');
  }
  if(e.objek==='Database'){
    let s=e.sebelum||{},a=e.sesudah||{};
    return `Transaksi ${s.jumlahTransaksi||0}→${a.jumlahTransaksi||0}, nominal ${rup(s.totalNominal||0)}→${rup(a.totalNominal||0)}`;
  }
  return esc(e.ref_id||e.objek||'');
}
function auditItem(e){

function muatAudit(reset){

  google.script.run.withSuccessHandler(r=>{
    auditCache.loading=false;
    if(!(r&&r.ok)){alert((r&&r.message)||'Gagal memuat jejak audit.');return}

function tglID(s){let m=/^(\d{4})-(\d{2})-(\d{2})/.exec(String(s||''));return m?(+m[3])+' '+BLN[+m[2]-1]+' '+m[1]:(s||'-')}
function rup(n){return new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(Number(n)||0)}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function dateNow(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function monthNow(){return dateNow().slice(0,7)}

const IN_CATS=['Iuran Warga','Jimpitan Jaga','Arisan Ngaji','Dana Sosial','Kas Musholla','Sumbangan','Bantuan Pemerintah','Hasil Kegiatan','Lain-lain'];
const DUES_CATS=[{k:'Iuran Warga'},{k:'Jimpitan Jaga'},{k:'Arisan Ngaji'},{k:'Dana Sosial'},{k:'Kas Musholla'}];
const TARIF_CATS=['Iuran Warga','Jimpitan Jaga','Arisan Ngaji','Dana Sosial','Kas Musholla'];
function arisanAktif(w){return !w||w.arisanAktif!==false}
function tarif(w,k,periode){
  if(k==='Arisan Ngaji'&&!arisanAktif(w))return 0;
  let hist=db.settings.tarifHistory||{}, key=periode?String(periode).slice(0,7):'';
  if(key&&hist[key]&&hist[key][k]!=null&&hist[key][k]!==''){
    let t=Number(hist[key][k])||0;
    return t||(k==='Iuran Warga'?Number(w.iuran)||0:0);
  }
  let t=Number((db.settings.tarif||{})[k])||0;
  return t||(k==='Iuran Warga'?Number(w.iuran)||0:0);
}
function saldoKat(k){let sk=db.settings&&db.settings.saldoKategori;if(sk)return Number(sk[k])||0;return k==='Lain-lain'?Number((db.settings&&db.settings.saldo)||0):0}
function paruhNow(){return +dateNow().slice(8,10)<=15?1:2}
function periodNow(k){return k==='Arisan Ngaji'?monthNow()+'-'+paruhNow():monthNow()}
function periodOf(t){if(t.kategori==='Arisan Ngaji'){let tg=String(t.tanggal||'');return /^\d{4}-\d{2}-[12]$/.test(t.periode||'')?t.periode:tg.slice(0,7)+'-'+(+tg.slice(8,10)<=15?1:2)}return t.periode}
function periodLabel(k,p){return k==='Arisan Ngaji'?p.slice(0,7)+(p.endsWith('-1')?' · tgl 1–15':' · tgl 16–akhir'):p}
function isLibur(k,p){if(k!=='Arisan Ngaji')return false;let arr=(db.settings&&db.settings.liburArisan)||[];return arr.indexOf(p)>=0}
function getTempatArisan(p){
  let map=(db.settings&&db.settings.tempatArisan)||{};
  return map[p]||'';
}
function setTempatArisan(p,wid){
  if(!need('operator'))return;
  if(!db.settings.tempatArisan) db.settings.tempatArisan={};
  if(wid) db.settings.tempatArisan[p]=wid;
  else delete db.settings.tempatArisan[p];
  save();
  render();
}
function getPemenangArisan(p){return (db.settings.pemenangArisan||{})[p]||''}
function setPemenangArisan(p,wid){
  if(!need('operator'))return;
  if(!db.settings.pemenangArisan||typeof db.settings.pemenangArisan!=='object')db.settings.pemenangArisan={};
  if(!wid)delete db.settings.pemenangArisan[p];
  else{
    let ada=db.transaksi.some(t=>t.jenis==='Pemasukan'&&t.kategori==='Arisan Ngaji'&&periodOf(t)===p);
    if(!ada&&!confirm('Belum ada setoran tercatat untuk periode ini. Tetap tetapkan pemenang?'))return;
    db.settings.pemenangArisan[p]=wid;
  }
  save();render();
}

function namaWarga(wid){
  if(!wid) return '';
  let w=db.warga.find(x=>x.id===wid);
  return w?w.nama:'';
}
function toggleLibur(p){
  if(!need('operator'))return;
  if(!p||!/^\d{4}-\d{2}-[12]$/.test(p))return;
  let arr=(db.settings.liburArisan||[]).slice();
  let i=arr.indexOf(p);
  if(i>=0){
    if(!confirm('Batalkan status libur untuk periode '+periodLabel('Arisan Ngaji',p)+'? Warga akan ditagih lagi.'))return;
    arr.splice(i,1);
  }else{
    let sudahBayar=db.transaksi.filter(t=>t.jenis==='Pemasukan'&&t.kategori==='Arisan Ngaji'&&periodOf(t)===p);
    let msg='Tandai periode '+periodLabel('Arisan Ngaji',p)+' sebagai LIBUR?\nWarga tidak akan ditagih untuk periode ini.';
    if(sudahBayar.length){
      let tot=sudahBayar.reduce((s,t)=>s+Number(t.nominal||0),0);
      msg+='\n\nPERHATIAN: sudah ada '+sudahBayar.length+' pembayaran (total '+rup(tot)+') pada periode ini. Transaksi tetap ada di kas. Lanjutkan hanya jika memang libur dan pembayaran akan dikoreksi manual.';
    }
    if(!confirm(msg))return;
    arr.push(p);
  }
  db.settings.liburArisan=arr;
  save();
  render();
}
function duesOf(k,p){
  if(isLibur(k,p)) return []; // periode libur: tidak ada tagihan
  let m=p.slice(0,7);
  return active().filter(w=>!w.tanggal||w.tanggal.slice(0,7)<=m).map(w=>{
    let tg=tarif(w,k,p),
        pays=db.transaksi.filter(t=>t.jenis==='Pemasukan'&&t.kategori===k&&t.wargaId===w.id&&periodOf(t)===p).sort((x,y)=>String(x.tanggal).localeCompare(String(y.tanggal))),
        paid=pays.reduce((s,t)=>s+Number(t.nominal||0),0),run=0,tl='',tempatLunas='';
    if(k==='Arisan Ngaji'&&!arisanAktif(w)&&paid>0)tg=paid; // sudah ada pembayaran tercatat: tampil lunas, tidak ditagih lagi
    if(tg>0&&paid>=tg){
      for(const t of pays){
        run+=Number(t.nominal||0);
        if(run>=tg){
          tl=t.tanggal;
          tempatLunas=t.tempatNama||'';
          break;
        }
      }
    }
    // fallback: ambil tempat dari pembayaran terakhir periode ini
    if(!tempatLunas&&pays.length){
      for(let i=pays.length-1;i>=0;i--){
        if(pays[i].tempatNama){tempatLunas=pays[i].tempatNama;break;}
      }
    }
    // fallback 2: tempat default periode (untuk data lama tanpa field tempat)
    if(!tempatLunas&&k==='Arisan Ngaji'){
      tempatLunas=namaWarga(getTempatArisan(p))||'';
    }
    return {...w,tagihan:tg,paid,left:Math.max(0,tg-paid),tglLunas:tl,tempatLunas:tempatLunas,dicatat:[...new Set(pays.map(pencatatLabel).filter(Boolean))].join(', ')};
  }).filter(w=>w.tagihan>0);
}

function lastMonths(n){
  let out=[],d=new Date();
  for(let i=n-1;i>=0;i--){let x=new Date(d.getFullYear(),d.getMonth()-i,1);out.push(x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0'))}
  return out;
}
function monthChartHtml(){
  let months=lastMonths(6);
  let data=months.map(m=>{let t=monthTotals(m);return {m,in:t.in||0,out:t.out||0}});
  let max=Math.max(1,...data.map(d=>Math.max(d.in,d.out)));
  let bars=data.map(d=>{
    let hi=Math.round(d.in/max*100),ho=Math.round(d.out/max*100);
    let label=d.m.slice(5)+'/'+d.m.slice(2,4);
    return `<div style="flex:1;min-width:36px;text-align:center"><div style="height:100px;display:flex;align-items:flex-end;justify-content:center;gap:3px">
<div title="Pemasukan ${rup(d.in)}" style="width:12px;height:${hi}%;min-height:${d.in?2:0}px;background:#16a34a;border-radius:4px 4px 0 0"></div>
<div title="Pengeluaran ${rup(d.out)}" style="width:12px;height:${ho}%;min-height:${d.out?2:0}px;background:#dc2626;border-radius:4px 4px 0 0"></div>
</div><div class="muted" style="font-size:10px;margin-top:4px">${label}</div></div>`;
  }).join('');
  return `<details class="card" open><summary><h3>Grafik 6 bulan terakhir</h3><span class="chev">▾</span></summary>
<div style="display:flex;gap:4px;align-items:flex-end;padding:8px 4px 0">${bars}</div>
<div class="muted" style="margin-top:8px;font-size:12px"><span style="display:inline-block;width:10px;height:10px;background:#16a34a;border-radius:2px;margin-right:4px"></span>Pemasukan
<span style="display:inline-block;width:10px;height:10px;background:#dc2626;border-radius:2px;margin:0 4px 0 12px"></span>Pengeluaran</div></details>`;
}

function remindWA(wid,k,p,left){let w=db.warga.find(x=>x.id===wid);if(!w||!w.hp)return;let q=String(w.hp).replace(/\D/g,'');if(q.startsWith('0'))q='62'+q.slice(1);else if(q.startsWith('8'))q='62'+q;let t=db.settings;let msg=`Yth. Bapak/Ibu ${w.nama}, kami pengurus ${t.rt}/${t.rw}. Mengingatkan ${k} periode ${periodLabel(k,p)} sebesar ${rup(left)} belum tercatat lunas. Mohon konfirmasi pembayarannya. Terima kasih.${t.bendahara?' — '+t.bendahara+' (Bendahara)':''}`;window.open('https://wa.me/'+q+'?text='+encodeURIComponent(msg),'_blank')}
function periodsUpTo(k,upto){
  // Generate periods in chronological order, oldest first, through upto.
  // For Arisan Ngaji, each month's first half (-1) must come before its second half (-2).
  const isArisan=k==='Arisan Ngaji';
  let [ey,em]=upto.slice(0,7).split('-').map(Number);
  let months=[];
  let y=ey, m=em;
  // Collect month keys backwards, then reverse MONTHS only (not the half-month periods).
  for(let i=0;i<120;i++){
    months.push(y+'-'+String(m).padStart(2,'0'));
    m--; if(m<1){m=12;y--;}
  }
  months.reverse();
  let list=[];
  for(const base of months){
    if(isArisan){list.push(base+'-1',base+'-2');}
    else list.push(base);
  }
  let idx=list.indexOf(upto);
  if(idx<0) return list;
  return list.slice(0,idx+1);
}
function unpaidBefore(wid,k,upto){
  // list of {periode, left, tagihan} for periods strictly before upto that still have left>0, oldest first
  let w=db.warga.find(x=>x.id===wid);
  if(!w) return [];
  let periods=periodsUpTo(k,upto);
  let out=[];
  for(let p of periods){
    if(p===upto) break;
    if(isLibur(k,p)) continue; // skip libur
    // skip periods before warga joined
    if(w.tanggal && w.tanggal.slice(0,7)>p.slice(0,7)) continue;
    let tg=tarif(w,k,p);
    if(tg<=0) continue;
    let paid=db.transaksi.filter(t=>t.jenis==='Pemasukan'&&t.kategori===k&&t.wargaId===wid&&periodOf(t)===p).reduce((s,t)=>s+Number(t.nominal||0),0);
    let left=Math.max(0,tg-paid);
    if(left>0) out.push({periode:p,left,tagihan:tg});
  }
  return out;
}
function quickPay(wid,k,p,left,fromWarga=false){
  if(!need('operator'))return;
  let arrears=unpaidBefore(wid,k,p);
  let totalArrears=arrears.reduce((s,a)=>s+a.left,0);
  let totalDue=totalArrears+left;
  let tempatId=k==='Arisan Ngaji'?getTempatArisan(p):'';
  let tempatNama=tempatId?namaWarga(tempatId):'';
  let tempatSuffix=tempatNama?' · di rumah '+tempatNama:'';
  let hint=totalArrears>0
    ? ('Tunggakan '+arrears.length+' periode sebelumnya: '+rup(totalArrears)+'\nPeriode ini: '+rup(left)+'\nTotal: '+rup(totalDue)+(tempatNama?'\nTempat bayar: rumah '+tempatNama:'')+'\n\nMasukkan nominal (akan dilunasi dari yang paling lama dulu):')
    : ('Nominal pembayaran '+k+' (maksimal '+rup(left)+')'+(tempatNama?'\nTempat: rumah '+tempatNama:''));
  let defVal=totalArrears>0?totalDue:left;
  let n=prompt(hint,defVal);
  if(n===null)return;
  n=Number(n);
  if(!n||n<=0){alert('Nominal tidak valid.');return;}
  let w=db.warga.find(x=>x.id===wid);
  let tgl=dateNow();
  let sisa=n;
  let dibuat=[];
  // 1. Lunasi tunggakan — lokasi = tempat bayar periode SAAT INI (mis. rumah Arga)
  for(let a of arrears){
    if(sisa<=0) break;
    let bayar=Math.min(sisa,a.left);
    db.transaksi.push({
      id:id('TRX'),tanggal:tgl,jenis:'Pemasukan',kategori:k,wargaId:wid,periode:a.periode,
      tempatId:tempatId||'',tempatNama:tempatNama||'',
      uraian:k+' '+w.nama+' periode '+periodLabel(k,a.periode)+(bayar<a.left?' (sebagian)':' (pelunasan tunggakan)')+tempatSuffix,
      nominal:bayar,metode:'Tunai',pencatat:pencatatNow(),dicatatOleh:auth.user,dicatatPeran:auth.role
    });
    dibuat.push(periodLabel(k,a.periode)+' '+rup(bayar)+(tempatNama?' @ '+tempatNama:''));
    sisa-=bayar;
  }
  // 2. Sisa ke periode saat ini
  if(sisa>0){
    let bayar=sisa;
    db.transaksi.push({
      id:id('TRX'),tanggal:tgl,jenis:'Pemasukan',kategori:k,wargaId:wid,periode:p,
      tempatId:tempatId||'',tempatNama:tempatNama||'',
      uraian:k+' '+w.nama+' periode '+periodLabel(k,p)+(bayar>left?' (termasuk lebih bayar)':'')+tempatSuffix,
      nominal:bayar,metode:'Tunai',pencatat:pencatatNow(),dicatatOleh:auth.user,dicatatPeran:auth.role
    });
    dibuat.push(periodLabel(k,p)+' '+rup(bayar)+(tempatNama?' @ '+tempatNama:''));
  }
  save();
  if(fromWarga){closeModal();render();openWarga(wid,p.slice(0,7));}
  else render();
  let msg='Pembayaran '+k+' dicatat.';
  if(tempatNama) msg+='\nTempat: rumah '+tempatNama;
  if(arrears.length&&dibuat.length){
    msg+='\n\nDialokasikan ke:\n• '+dibuat.join('\n• ');
    if(totalArrears>0 && n>=totalArrears) msg+='\n\nTunggakan periode sebelumnya telah dilunasi.';
  }
  alert(msg);
}

function laporanPage(){let m=document.getElementById('reportMonth')?.value||monthNow(),v=monthTotals(m),awal=Number(db.settings.saldo)+db.transaksi.filter(t=>t.tanggal<m+'-01').reduce((s,t)=>s+(t.jenis==='Pemasukan'?1:-1)*Number(t.nominal||0),0),daily=dailyTotals(m);return `<div class="card"><h2>Laporan Bulanan</h2><label>Pilih bulan</label><input id="reportMonth" type="month" value="${m}" onchange="render()"><div class="metric"><small>Saldo awal bulan</small><strong>${rup(awal)}</strong></div><div class="grid" style="margin-top:10px"><div class="metric income" style="cursor:pointer" onclick="openPemasukan('${m}')" title="Ketuk untuk lihat rincian"><small>💰 Pemasukan</small><strong class="positive link">${rup(v.in)}</strong></div><div class="metric expense" style="cursor:pointer" onclick="openPengeluaran('${m}')" title="Ketuk untuk lihat rincian"><small>💸 Pengeluaran</small><strong class="negative link">${rup(v.out)}</strong></div></div><div class="metric" style="margin-top:10px"><small>Saldo akhir bulan</small><strong>${rup(awal+v.in-v.out)}</strong></div><div class="actions"><button class="btn" onclick="laporanPdf('${m}')">Cetak / PDF laporan</button><button class="btn secondary" onclick="exportReport('${m}')">Unduh CSV</button><button class="btn secondary" onclick="exportDailyReport('${m}')">CSV harian</button></div></div>
<div class="card"><h3>Laporan PDF per kategori · ${m}</h3><p class="note">Pilih kategori (misalnya Jimpitan Jaga). Satu PDF memuat pemasukan, pengeluaran dari dana kategori itu, dan sisa saldonya untuk bulan di atas.</p><label>Kategori</label><select id="katLap" onchange="render()">${lapKatOptions(document.getElementById('katLap')?.value)}</select><div class="actions"><button class="btn" onclick="laporanPdf('${m}',document.getElementById('katLap').value)">Cetak / PDF kategori</button></div></div>
<details class="card"><summary><h3>Rekapitulasi laporan per hari · ${m}</h3><span class="chev">▾</span></summary><div class="grid"><div class="metric"><small>Total hari bertransaksi</small><strong>${daily.length} hari</strong></div><div class="metric"><small>Jumlah transaksi</small><strong>${daily.reduce((a,d)=>a+d.count,0)}</strong></div></div><div class="actions"><button class="btn secondary small" onclick="exportDailyReport('${m}')">Unduh rekap harian CSV</button></div>${daily.length?daily.slice().reverse().map(d=>`<div class="item"><div class="itemtop"><b>${tglID(d.tanggal)}</b><span class="pill">${d.count} transaksi</span></div><div class="row" style="margin-top:8px"><div><small class="muted">Pemasukan</small><div class="amount positive">${rup(d.in)}</div></div><div><small class="negative">Pengeluaran</small><div class="amount negative">${rup(d.out)}</div></div></div><div class="itemtop" style="margin-top:8px"><span class="muted">Selisih harian</span><b class="${d.in-d.out>=0?'positive':'negative'}">${rup(d.in-d.out)}</b></div><details style="margin-top:8px"><summary class="link">Lihat transaksi hari ini</summary>${txList(db.transaksi.filter(t=>t.tanggal===d.tanggal))}</details></div>`).join(''):'<div class="empty">Belum ada transaksi pada bulan ini.</div>'}</details>
<p class="note" style="text-align:center;padding:12px">Rincian transaksi lengkap dapat dilihat pada menu <b>Beranda → Total Pemasukan/Pengeluaran → pilih kategori</b> atau di <b>Transaksi</b>.</p>`}
function dailyTotals(m){let map={};db.transaksi.filter(t=>String(t.tanggal||'').startsWith(m)).forEach(t=>{let d=t.tanggal;if(!map[d])map[d]={tanggal:d,in:0,out:0,count:0};map[d][t.jenis==='Pemasukan'?'in':'out']+=Number(t.nominal||0);map[d].count++});return Object.values(map).sort((a,b)=>a.tanggal.localeCompare(b.tanggal))}
function exportDailyReport(m){let rows=dailyTotals(m);download('rekap-harian-'+m+'.csv','Tanggal,Jumlah Transaksi,Pemasukan,Pengeluaran,Selisih\n'+rows.map(d=>[d.tanggal,d.count,d.in,d.out,d.in-d.out].map(csv).join(',')).join('\n'))}
function lapKatOptions(sel){return IN_CATS.map(k=>`<option value="${k}" ${sel===k?'selected':''}>${k}</option>`).join('')}
function exportReport(m){let a=db.transaksi.filter(t=>t.tanggal.startsWith(m));download('laporan-'+m+'.csv','Tanggal,Jenis,Kategori,Sumber Dana,Uraian,Nominal,Metode,Dicatat oleh\n'+a.map(t=>[t.tanggal,t.jenis,t.kategori,t.sumberDana,t.uraian,t.nominal,t.metode,pencatatLabel(t)].map(csv).join(',')).join('\n'))}
function csv(v){return '"'+String(v??'').replace(/"/g,'""')+'"'}
function receipt(x){let t=db.transaksi.find(a=>a.id===x),w=db.warga.find(a=>a.id===t.wargaId);let win=window.open('','_blank');if(!win){alert('Izinkan pop-up untuk mencetak kuitansi.');return}win.document.write(`<html><head><title>Kuitansi</title><style>body{font:16px Arial;padding:28px}h2{text-align:center}.box{border:1px solid #555;padding:20px;max-width:500px;margin:auto}.line{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px dashed #bbb}</style></head><body><div class="box"><h2>KUITANSI PEMBAYARAN</h2><p>${esc(db.settings.rt)} / ${esc(db.settings.rw)} · ${esc(db.settings.desa)}</p><div class="line"><span>No. Transaksi</span><b>${esc(t.id)}</b></div><div class="line"><span>Tanggal</span><b>${esc(t.tanggal)}</b></div><div class="line"><span>Diterima dari / terkait</span><b>${esc(w?.nama||'-')}</b></div><div class="line"><span>Keterangan</span><b>${esc(t.uraian)}</b></div><div class="line"><span>Nominal</span><b>${rup(t.nominal)}</b></div><div class="line"><span>Metode</span><b>${esc(t.metode)}</b></div>${pencatatLabel(t)?`<div class="line"><span>Dicatat oleh</span><b>${esc(pencatatLabel(t))}</b></div>`:''}${t.sumberDana?`<div class="line"><span>Sumber Dana</span><b>${esc(t.sumberDana)}</b></div>`:'' }<p style="text-align:right;margin-top:40px">Bendahara,<br><br><br><b>${esc(db.settings.bendahara||'________________')}</b></p></div><script>var B=window.AndroidBridge||(window.opener&&window.opener.AndroidBridge);if(B){B.printHtml(document.documentElement.outerHTML)}else{window.print()}<\/script></body></html>`);win.document.close()}
function lainPage(){let s=db.settings;return passwordCard()+userCard()+logHapusCard()+(canEdit()?`<details class="card"><summary><h2 style="margin:0;font-size:18px">Pengaturan RT/RW</h2><span class="chev">▾</span></summary><form onsubmit="saveSettings(event)"><p class="note">🔒 Identitas RT/RW dikunci permanen untuk RT 003. Hanya tahun laporan, tarif, saldo awal, dan bendahara yang dapat diubah.</p>
<label>Nama RT 🔒</label><input id="sRt" readonly style="background:#e8eee8;color:#4b5563" value="${esc(IDENTITAS.rt)}">
<label>Nama RW 🔒</label><input id="sRw" readonly style="background:#e8eee8;color:#4b5563" value="${esc(IDENTITAS.rw)}">
<label>Desa / Kelurahan 🔒</label><input id="sDesa" readonly style="background:#e8eee8;color:#4b5563" value="${esc(IDENTITAS.desa)}">
<label>Kecamatan 🔒</label><input id="sKec" readonly style="background:#e8eee8;color:#4b5563" value="${esc(IDENTITAS.kecamatan)}">
<label>Kabupaten / Kota 🔒</label><input id="sKota" readonly style="background:#e8eee8;color:#4b5563" value="${esc(IDENTITAS.kota)}">
<label>Tahun laporan</label><input id="sTahun" type="number" value="${s.tahun}"><h3 style="margin-top:16px">Saldo awal tiap kategori (Rp)</h3><p class="note">Saldo awal kas = jumlah semua kategori di bawah.</p>${IN_CATS.map((k,i)=>`<label>${k}</label><input id="sk${i}" type="number" value="${saldoKat(k)}">`).join('')}<h3 style="margin-top:16px">Tarif per KK (Rp)</h3><p class="note">Tarif berlaku sama untuk semua KK. Arisan Ngaji ditagih tiap 2 minggu (tgl 1–15 dan 16–akhir bulan).</p>${TARIF_CATS.map((k,i)=>`<label>${k} (${k==='Arisan Ngaji'?'per 2 minggu':'per bulan'})</label><input id="st${i}" type="number" min="0" value="${(s.tarif||{})[k]||0}">`).join('')}<label>Nama bendahara</label><input id="sBendahara" value="${esc(s.bendahara)}"><div class="actions"><button class="btn">Simpan pengaturan</button></div></form></details>`:'')+`
<details class="card"><summary><h3>Supabase · Database bersama</h3><span class="chev">▾</span></summary><p class="note">Data utama disimpan di database Supabase milik pengurus. Perangkat lain yang membuka aplikasi ini akan membaca database yang sama. Aplikasi memeriksa pembaruan otomatis setiap 30 detik; gunakan tombol perbarui untuk mengambil data terbaru sekarang.</p><div class="actions"><button class="btn" onclick="refreshCloud(false)">↻ Perbarui dari server</button></div></details>
${canEdit()?`<details class="card"><summary><h3>Cadangkan & pulihkan data</h3><span class="chev">▾</span></summary><p class="note">Backup JSON dapat diunduh sebagai salinan tambahan. Database utama berada di Supabase, bukan hanya di browser HP.</p><div class="actions"><button class="btn" onclick="backup()">Unduh backup</button><label class="btn secondary" style="display:inline-block;margin:0">Pulihkan backup<input type="file" accept="application/json" hidden onchange="restore(event)"></label></div><div class="actions"><button class="btn secondary" onclick="exportWarga()">Ekspor data warga CSV</button><button class="btn danger" onclick="resetAll()">Hapus seluruh data</button></div></details>`:''}
<details class="card"><summary><h3>Tentang aplikasi</h3><span class="chev">▾</span></summary><p class="note">Aplikasi mengikuti workbook terbaru: Dashboard, Pengaturan, Data Warga, Transaksi, Tagihan Iuran, Laporan Bulanan, dan Kuitansi. Termasuk kategori Arisan Ngaji serta rekap saldo setiap kategori pemasukan dan pengeluaran.</p><div style="margin-top:14px;text-align:right;font-size:11px;letter-spacing:.6px;color:var(--muted);opacity:.7;font-style:italic">by : @argisk</div></details>`}
function saveSettings(e){e.preventDefault();if(!need('operator'))return;let sk=IN_CATS.map((k,i)=>+document.getElementById('sk'+i).value||0);let ident={...IDENTITAS};if(isAdmin()){let alasan=mintaAlasan('Alasan ubah pengaturan (opsional)','');if(alasan===null)return;if(alasan){setAlasan(null,alasan,true);db._alasan._pengaturan=alasan}}let newTarif=Object.fromEntries(TARIF_CATS.map((k,i)=>[k,+document.getElementById('st'+i).value||0]));
let th=Object.assign({},db.settings.tarifHistory||{});
th[monthNow()]=Object.assign({},newTarif);
db.settings={...ident,tahun:+sTahun.value,saldo:sk.reduce((x,y)=>x+y,0),saldoKategori:Object.fromEntries(IN_CATS.map((k,i)=>[k,sk[i]])),tarif:newTarif,tarifHistory:th,bendahara:sBendahara.value,liburArisan:db.settings.liburArisan||[],tempatArisan:db.settings.tempatArisan||{},pemenangArisan:db.settings.pemenangArisan||{},...(db.settings.totalKK!=null?{totalKK:db.settings.totalKK}:{}),...(db.settings.pengumuman?{pengumuman:db.settings.pengumuman}:{})};save();render();alert('Pengaturan disimpan.')}
function download(name,content,type='text/csv;charset=utf-8'){let b=new Blob(['\ufeff'+content],{type}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=name;a.click();URL.revokeObjectURL(u)}
function backup(){download('backup-keuangan-rt-'+dateNow()+'.json',JSON.stringify(db,null,2),'application/json')}
function restore(e){if(!need('operator'))return;let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x.settings||!Array.isArray(x.warga)||!Array.isArray(x.transaksi))throw 0;if(confirm('Pulihkan backup? Data saat ini akan diganti.')){db=x;save();render();alert('Backup berhasil dipulihkan.')}}catch(z){alert('File backup tidak valid.')}};r.readAsText(f)}
function exportWarga(){download('data-warga.csv','ID KK,Nama,Alamat,No HP,Iuran Bulanan,Tanggal Bergabung,Status,Arisan Ngaji,Nama Anggota/Penerima,Catatan\n'+db.warga.map(w=>[w.id,w.nama,w.alamat,w.hp,w.iuran,w.tanggal,w.status,arisanAktif(w)?'Aktif':'Nonaktif',w.anggota,w.catatan].map(csv).join(',')).join('\n'))}
function resetAll(){if(!need('operator'))return;if(confirm('Yakin hapus seluruh warga, transaksi, dan pengaturan? Unduh backup dulu jika diperlukan.')){db=structuredClone(defaults);save();render()}}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>go(b.dataset.tab));
document.getElementById('app').innerHTML=`<div class="card"><h2>Menghubungkan ke server…</h2><p class="note">Mohon tunggu sebentar. Data akan dimuat dari database bersama.</p><div class="actions" style="margin-top:14px"><button class="btn secondary" onclick="doLogout(true)">Masuk ulang</button></div></div>`;
// Jika setelah 12 detik masih belum siap, tawarkan masuk ulang
setTimeout(function(){
  if(!cloudReady && document.getElementById('app') && document.getElementById('app').innerHTML.indexOf('Menghubungkan')>=0){
    setSyncStatus('Koneksi lambat atau sesi bermasalah',false);
    document.getElementById('app').innerHTML=`<div class="card"><h2>Belum terhubung</h2><p class="note">Koneksi ke server lambat atau sesi login sudah tidak valid. Silakan masuk ulang.</p><div class="actions"><button class="btn" onclick="doLogout(true)">Masuk ulang</button><button class="btn secondary" onclick="refreshCloud(false)">Coba lagi</button></div></div>`;
  }
},12000);
initCloud();
</script><script>
/* Jembatan Android: simpan file ke folder Download di aplikasi Android. Di browser biasa tidak berpengaruh. */
(function(){
  if(!window.AndroidBridge)return;
  window.download=function(name,content,type){
    try{AndroidBridge.saveFile(String(name),'\ufeff'+content,String(type||'text/csv'))}
    catch(e){alert('Gagal menyimpan file: '+e.message)}
  };
})();
</script>
</body></html>
